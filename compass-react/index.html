<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NorthCode — Diseño Web &amp; Desarrollo</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=3" />
  <link rel="shortcut icon" href="/favicon.ico?v=3" />
  <meta name="description" content="Agencia de diseño web, branding y contenido visual en Santo Domingo. Sitios web, identidades de marca y producción audiovisual." />
  <meta name="theme-color" content="#0d1b2a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script>
    // Prevent FOUC: apply saved theme before paint
    (function(){
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches))
        document.documentElement.setAttribute('data-theme','dark');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
